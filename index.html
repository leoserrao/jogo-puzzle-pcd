<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>Inclusive Puzzle - Jogo Acessível</title>
  <meta name="description" content="Um jogo de quebra-cabeça acessível com comandos de voz e suporte a leitor de tela.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            access: {
              yellow: '#FFFF00',
              black: '#000000',
              white: '#FFFFFF',
              blue: '#003366',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* High Contrast Utilities */
    .high-contrast {
      background-color: #000000 !important;
      color: #FFFF00 !important;
    }

    .high-contrast button {
      border: 2px solid #FFFF00 !important;
      background-color: #000000 !important;
      color: #FFFF00 !important;
    }

    .high-contrast .tile-number {
      background-color: #000000 !important;
      color: #FFFF00 !important;
      font-weight: bold !important;
    }

    /* Focus Styles for Accessibility */
    *:focus-visible {
      outline: 4px solid #3b82f6;
      outline-offset: 2px;
    }

    .high-contrast *:focus-visible {
      outline: 4px solid #FFFF00;
      outline-offset: 4px;
    }

    /* Error Shake Animation */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      10%,
      30%,
      50%,
      70%,
      90% {
        transform: translateX(-5px);
      }

      20%,
      40%,
      60%,
      80% {
        transform: translateX(5px);
      }
    }

    .animate-shake {
      animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
    }

    /* Avaliação Section Styles */
    #avaliation {
      margin: 40px auto;
      padding: 24px;
      background: linear-gradient(135deg, #f5f9ff, #e8f0fe);
      border: 2px solid #cfe1ff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 660px;
      width: min(90%, 660px);
      text-align: center;
      transition: transform .25s ease, box-shadow .25s ease, background .3s ease;
    }

    #avaliation:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #ebf4ff, #d8e8ff);
    }

    #avaliation h2 {
      color: #003f88;
      margin-bottom: 12px;
      font-size: 1.6rem;
      letter-spacing: .02em;
    }

    #avaliation h3 {
      font-weight: normal;
      margin-bottom: 5px;
    }

    #avaliation h4 {
      font-weight: normal;
      font-style: italic;
      color: #555;
      margin-bottom: 15px;
    }

    #avaliation img {
      display: block;
      margin: 16px auto;
      border: 2px solid #ddd;
      padding: 8px;
      border-radius: 12px;
      width: min(180px, 80%);
      height: auto;
      background-color: #fff;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>

  <!-- VLibras Widget -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  <script type="module" src="/index.tsx"></script>

  <div id="avaliation" role="region" aria-live="polite">
    <h2>Avalie o jogo</h2>
    <h3>O que você achou do jogo?</h3>
    <h4>Aponte a câmera para o qr-code</h4>
    <img src="qrcode.png" alt="QR Code para avaliação do jogo" width="150" height="150">
  </div>

  <footer aria-label="Informação de acessibilidade" style="text-align:center; margin-top:16px; font-size:0.9rem; color:#333;">
    Desenvolvido com foco em Design Universal e Acessibilidade (WCAG 2.1 AA).
  </footer>
</body>

</html>
